tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of contacts with optional pagination.
security:
  - bearerAuth: []
parameters:
  - $ref: '../../components/parameters/pagination.yaml#/page'
  - $ref: '../../components/parameters/pagination.yaml#/perPage'
  - $ref: '../../components/parameters/pagination.yaml#/sortBy'
  - $ref: '../../components/parameters/pagination.yaml#/sortOrder'
  - $ref: '../../components/parameters/pagination.yaml#/isFavourite'
  - $ref: '../../components/parameters/pagination.yaml#/contactType'
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contacts successfully found
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '../../components/schemas/Contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 50
                totalPages:
                  type: integer
                  example: 5
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
