tags:
  - contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of contacts with optional pagination.
security:
  - bearerAuth: []
parameters:
  - $ref: '../../components/parameters/pagination.yaml#/page'
  - $ref: '../../components/parameters/pagination.yaml#/perPage'
  - $ref: '../../components/parameters/pagination.yaml#/sortBy'
  - $ref: '../../components/parameters/pagination.yaml#/sortOrder'
  - $ref: '../../components/parameters/pagination.yaml#/isFavourite'
  - $ref: '../../components/parameters/pagination.yaml#/contactType'
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 40
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
