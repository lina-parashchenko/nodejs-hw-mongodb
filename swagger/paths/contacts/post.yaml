tags:
  - contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the database.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../components/schemas/ContactCreate.yaml'
responses:
  '201':
    description: Created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: array
              items:
                type: string
              example: Contact created successfully
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: ../../components/responses/401.yaml
