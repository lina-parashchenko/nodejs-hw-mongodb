description: Validation error
content:
  application/json:
    schema:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Email is invalid
      required:
        - message
        - errors
