description: Validation error
type: object
properties:
  status:
    type: integer
    example: 400
  message:
    type: string
    example: Validation failed
  data:
    type: array
    items:
      type: object
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Email is invalid
required:
  - status
  - message
  - data
